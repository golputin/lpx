<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="g" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- terminal plate -->
  <rect x="14" y="18" width="100" height="92" rx="16" fill="#0B1220" stroke="url(#g)" stroke-width="3"/>
  <rect x="22" y="28" width="84" height="56" rx="8" fill="#020617"/>
  <!-- bars / crash chart -->
  <g filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 70 L42 58 L52 62 L64 40 L76 48 L88 28 L98 34" stroke="url(#g)" stroke-width="4" fill="none"/>
    <circle cx="98" cy="34" r="4" fill="#FBBF24"/>
  </g>
  <!-- base label -->
  <rect x="36" y="92" width="56" height="10" rx="5" fill="url(#g)" opacity="0.9"/>
</svg>
